version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: geckevent_db
    environment:
      POSTGRES_USER: geckevent
      POSTGRES_PASSWORD: geckevent123
      POSTGRES_DB: geckevent_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geckevent_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: